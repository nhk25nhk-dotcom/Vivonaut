<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Vivonaut - Your Intelligent Health Companion in Space</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2308142e'/%3E%3Cpath d='M6 26h9l4-10 6 20 5-14 3 4h9' fill='none' stroke='%2335e0ff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ===== STYLE: TOKENS ===== */
:root{
  --bg-0:#040b1c; --bg-1:#08142e; --bg-2:#0d1d40;
  --glass:rgba(13,30,62,.66); --glass-strong:rgba(10,24,52,.92); --glass-border:rgba(90,165,255,.24);
  --text:#e8f1ff; --text-dim:#a3b8d8; --text-faint:#7c91b4;
  --cyan:#35e0ff; --blue:#3b82f6; --glow:0 0 28px rgba(53,224,255,.22);
  --st-stable:#34e8b0;  --st-stable-bg:rgba(52,232,176,.14);
  --st-watch:#ffcb3d;   --st-watch-bg:rgba(255,203,61,.14);
  --st-needs:#ff8d32;   --st-needs-bg:rgba(255,141,50,.15);
  --st-alert:#ff5566;   --st-alert-bg:rgba(255,85,102,.16);
  --st-nodata:#97a4bb;  --st-nodata-bg:rgba(151,164,187,.14);
  --emg-bg:#3a0610; --emg-fg:#fff1f2;
  --tag-sourced:#6db3ff; --tag-demo:#ffb454; --tag-baseline:#5eeb8f; --tag-sim:#c2a8ff;
  --chart-line:#35e0ff; --chart-band:rgba(53,224,255,.12); --chart-grid:rgba(160,190,235,.16);
  --radius:18px; --radius-sm:10px; --gap:14px; --pad:16px; --topbar-h:68px; --nav-w:184px;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-0:.74rem; --fs-1:.84rem; --fs-2:.95rem; --fs-3:1.1rem; --fs-4:1.4rem; --fs-5:1.9rem; --fs-emg:2.4rem;
  --dur:.25s; --ease:cubic-bezier(.2,.7,.2,1); --motion-scale:1;
  --focus-ring:0 0 0 3px rgba(53,224,255,.55);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--font-ui);font-size:var(--fs-2);line-height:1.45;color:var(--text);
  background:radial-gradient(1200px 700px at 78% -10%,#12306b 0%,transparent 60%),radial-gradient(900px 600px at 5% 105%,#0b2a5a 0%,transparent 55%),linear-gradient(180deg,var(--bg-1),var(--bg-0));
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 33% 72%,#bcd8ff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 61% 28%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 84% 64%,#bcd8ff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 92% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 47% 91%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 5% 55%,#bcd8ff 50%,transparent 51%);
  background-size:620px 520px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:var(--focus-ring)}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--cyan);color:#001;padding:8px 14px;border-radius:8px;font-weight:700}
.skip:focus{top:8px}
svg.ico{width:1.25em;height:1.25em;flex:none;vertical-align:-.22em}
@media (prefers-reduced-motion:reduce){
  :root{--motion-scale:0}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
/* ===== END STYLE: TOKENS ===== */
/* ===== STYLE: UI_LAYOUT ===== */
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 18px;background:rgba(5,13,32,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--glass-border);z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 8px rgba(53,224,255,.45))}
.brand h1{font-size:1.35rem;line-height:1.1;letter-spacing:.02em}
.brand .tag{font-size:var(--fs-0);color:var(--text-dim)}
.tb-sep{width:1px;align-self:stretch;background:var(--glass-border);margin:4px 2px}
.tb-status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--text-dim);font-size:var(--fs-1);min-width:0}
.tb-status strong{color:var(--text);font-weight:600}
.tb-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--glass-border);background:rgba(20,45,90,.45);font-size:var(--fs-1);white-space:nowrap}
.pill.link{border-color:rgba(255,203,61,.5);background:var(--st-watch-bg);color:#ffe08a}
.pill.demo{border-color:rgba(255,180,84,.6);background:rgba(255,180,84,.14);color:#ffd18a;font-weight:700;letter-spacing:.04em}
.pill.clock{font-family:var(--font-mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(25,55,110,.5);font-weight:600;font-size:var(--fs-1);transition:background var(--dur) var(--ease),transform var(--dur) var(--ease)}
.btn:hover{background:rgba(40,85,160,.6)}
.btn.primary{background:linear-gradient(180deg,#3b8bff,#2a6be0);border-color:#6aa6ff;color:#fff}
.btn.primary:hover{background:linear-gradient(180deg,#559bff,#3b7cf0)}
.btn.ghost{background:transparent}
.btn.guided{border-color:rgba(53,224,255,.6);background:rgba(53,224,255,.12);color:#bff4ff}
.btn.round{width:40px;height:40px;padding:0;border-radius:50%}
.btn.emergency{border-color:rgba(255,85,102,.75);background:rgba(255,85,102,.16);color:#ffd7db}
.btn.emergency:hover{background:rgba(255,85,102,.3)}
.profile-wrap{position:relative}
.profile-btn{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--glass-border);background:rgba(20,45,90,.5)}
.avatar{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:.8rem;color:#001a2e;background:linear-gradient(135deg,#7bf0ff,#4a9bff);border:2px solid rgba(255,255,255,.5)}
.profile-menu{position:absolute;left:0;top:calc(100% + 8px);min-width:270px;background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:14px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.5);z-index:40}
.profile-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:10px;text-align:left}
.profile-menu button:hover,.profile-menu button[aria-checked=true]{background:rgba(59,130,246,.22)}
.profile-menu small{display:block;color:var(--text-dim)}
.banner{padding:7px 18px;font-size:var(--fs-1);color:#ffd9a3;background:rgba(255,180,84,.09);border-bottom:1px solid rgba(255,180,84,.25)}
.banner.warn{color:#ffe9a8;background:rgba(255,203,61,.1)}
/* shell + nav */
.shell{display:flex;flex:1;gap:0;min-height:0}
.nav{width:var(--nav-w);flex:none;padding:16px 10px;display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:1px solid transparent;background:transparent;text-align:left;color:var(--text-dim);font-weight:600}
.nav button:hover{background:rgba(40,85,160,.28);color:var(--text)}
.nav button[aria-current=page]{background:linear-gradient(180deg,rgba(59,130,246,.55),rgba(42,107,224,.4));border-color:rgba(106,166,255,.55);color:#fff;box-shadow:var(--glow)}
.nav svg.ico{width:1.4em;height:1.4em}
main{flex:1;min-width:0;padding:16px 18px 90px}
.foot{font-size:var(--fs-0);color:var(--text-faint);text-align:center;padding:10px 14px 18px}
/* cards */
.card{position:relative;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:var(--pad);box-shadow:var(--glow);min-width:0}
.card h2{display:flex;align-items:center;gap:9px;font-size:var(--fs-3);margin-bottom:10px}
.card h2 .ico{color:var(--cyan)}
.muted{color:var(--text-dim)} .faint{color:var(--text-faint)}
/* dashboard grid */
.dash{display:grid;gap:var(--gap);grid-template-columns:minmax(280px,340px) minmax(300px,1fr) minmax(300px,390px);
  grid-template-areas:"status body viva" "inds body viva" "inds body alerts" "trends tasks emerg"}
.a-status{grid-area:status}.a-inds{grid-area:inds}.a-body{grid-area:body}.a-viva{grid-area:viva}.a-alerts{grid-area:alerts}.a-trends{grid-area:trends}.a-tasks{grid-area:tasks}.a-emerg{grid-area:emerg}
.stat-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(120,160,220,.12)}
.stat-row:last-of-type{border-bottom:0}
.stat-row .n{margin-left:auto;font-weight:700;font-size:var(--fs-3)}
.s-stable{color:var(--st-stable)}.s-watch{color:var(--st-watch)}.s-needs{color:var(--st-needs)}.s-alert{color:var(--st-alert)}.s-nodata{color:var(--st-nodata)}
.note{font-size:var(--fs-1);color:var(--text-dim);margin-top:8px}
.ind{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(120,160,220,.12)}
.ind:last-child{border-bottom:0}
.ind .ico-wrap{grid-row:1/3;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(53,224,255,.1);color:var(--cyan)}
.ind .nm{font-weight:600;font-size:var(--fs-1)}
.ind .desc{grid-column:2/4;font-size:var(--fs-0);color:var(--text-faint)}
.chip-status{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:var(--fs-0);font-weight:700}
.chip-status.nodata{color:var(--st-nodata);background:var(--st-nodata-bg);border:1px solid rgba(151,164,187,.4)}
/* body map */
.body-card{display:flex;flex-direction:column}
.body-svg{width:100%;max-width:520px;height:auto;max-height:640px}
.caption{font-size:var(--fs-0);color:var(--text-dim);text-align:center;margin-top:6px}
/* viva */
.viva-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.viva-head h2{margin:0}
.viva-stage{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.viva-robot{width:112px;align-self:center;flex:none;filter:drop-shadow(0 0 12px rgba(53,224,255,.35))}
.viva-robot .bob{animation:bob 4.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.viva-log{min-width:0;max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.bubble{background:rgba(25,55,110,.55);border:1px solid var(--glass-border);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:var(--fs-1)}
.bubble.you{align-self:flex-end;background:rgba(59,130,246,.4);border-radius:14px 14px 4px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid rgba(106,166,255,.55);background:rgba(25,55,110,.45);font-weight:600;font-size:var(--fs-1)}
.chip.primary{background:linear-gradient(180deg,#3b8bff,#2a6be0);border-color:#6aa6ff;color:#fff}
.chip:hover{filter:brightness(1.15)}
.listen{margin-top:10px;width:100%}
/* help drawer + modal + toast */
.scrim{position:fixed;inset:0;background:rgba(2,6,16,.6);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--glass-strong);border-left:1px solid var(--glass-border);z-index:70;padding:20px;overflow:auto;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
.drawer h2{font-size:var(--fs-4)} .drawer h3{font-size:var(--fs-2);margin:16px 0 4px;color:var(--cyan)}
.drawer p{color:var(--text);margin-top:6px;font-size:var(--fs-1)}
.drawer .x{position:absolute;top:12px;right:12px}
.modal{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 28px));background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:var(--radius);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal h2{font-size:var(--fs-4);margin-bottom:8px} .modal p{color:var(--text-dim);margin-bottom:10px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 24px))}
.toast{background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:12px;padding:10px 14px;font-size:var(--fs-1);box-shadow:0 10px 28px rgba(0,0,0,.5)}
.fab-emergency{display:none}
/* simple screens */
.page{max-width:900px;margin:0 auto;display:grid;gap:var(--gap)}
.page h1{font-size:var(--fs-5);margin-bottom:2px}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-weight:600;font-size:var(--fs-1)}
.field select,.field input[type=range]{width:100%;padding:9px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(8,20,46,.9);color:var(--text)}
.field input[type=range]{padding:0}
.switch{display:flex;align-items:center;gap:12px}
.switch input{width:22px;height:22px;accent-color:#3b82f6}
.voice-note{padding:10px 12px;border-radius:10px;background:rgba(53,224,255,.08);border:1px solid rgba(53,224,255,.25);font-size:var(--fs-1);margin-top:10px}
.voice-warn{padding:10px 12px;border-radius:10px;background:var(--st-watch-bg);border:1px solid rgba(255,203,61,.45);font-size:var(--fs-1);margin-top:10px;color:#ffe9a8}
/* responsive */
@media (min-width:1440px){.topbar{position:sticky;top:0}}
@media (max-width:1699px){.brand .tag{display:none}.topbar{gap:8px 10px;padding:8px 14px}.tb-status{gap:8px 10px}.pill{padding:4px 9px;font-size:var(--fs-0)}.tb-actions .btn{padding:8px 11px}}
@media (max-width:1439px){
  .btn.emergency.in-bar{display:none}
  .fab-emergency{display:inline-flex;position:fixed;right:14px;bottom:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.55);background:#4b0c18;padding:12px 16px}
}
@media (max-width:1099px){
  .dash{grid-template-columns:1fr 1fr;grid-template-areas:"viva status" "viva inds" "body inds" "body alerts" "trends trends" "tasks emerg"}
  .nav{width:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;gap:4px;border-bottom:1px solid var(--glass-border)}
  .shell{flex-direction:column}
  .nav button{flex-direction:column;gap:3px;padding:8px 12px;font-size:var(--fs-0);min-width:72px;align-items:center;text-align:center}
  .tb-sep{display:none}
}
@media (max-width:719px){
  .dash{grid-template-columns:1fr;grid-template-areas:"viva" "status" "inds" "body" "alerts" "trends" "tasks" "emerg"}
  .topbar{padding:8px 12px}
  .brand .tag{display:none}
  .tb-actions{margin-left:0;width:100%}
  .btn .lbl-long{display:none}
  .viva-robot{width:96px}
  main{padding:12px 12px 90px}
}
@media (max-width:420px){ .brand h1{font-size:1.15rem} .pill{font-size:var(--fs-0)} .profile-btn .pn{display:none} }
/* ===== END STYLE: UI_LAYOUT ===== */
/* ===== STYLE: VITALS ===== */
[hidden]{display:none!important}
/* categorical series, fixed order (dark steps of the validated palette): blue, orange, aqua */
:root{--series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--band-ref:rgba(52,232,176,.07);--band-base:rgba(53,224,255,.16);--surface-ring:#0b1a3a}
.small{padding:6px 11px!important;font-size:var(--fs-0)!important;border-radius:10px!important}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.err{color:#ffb3bb;font-size:var(--fs-1);min-height:1em;margin-top:6px}
.page.wide{max-width:1340px}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.vhead h1{font-size:var(--fs-5)}

/* tags and confidence chips */
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:var(--fs-0);font-weight:700;border:1px solid currentColor;white-space:nowrap;line-height:1.5}
.tag.sourced{color:var(--tag-sourced)} .tag.demo{color:var(--tag-demo)} .tag.baseline{color:var(--tag-baseline)} .tag.sim{color:var(--tag-sim)} .tag.entered{color:var(--text-dim)}
.conf{display:inline-block;padding:1px 9px;border-radius:999px;font-size:var(--fs-0);font-weight:700;border:1px solid currentColor;white-space:nowrap}
.conf.ok{color:var(--st-stable)} .conf.sim{color:var(--tag-sim)} .conf.nv{color:var(--st-watch)} .conf.inc{color:var(--st-nodata)}

/* tabs and segmented control */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.tabs button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--glass-border);background:rgba(20,45,90,.4);font-size:var(--fs-1);font-weight:600}
.tabs button[aria-selected=true]{background:linear-gradient(180deg,#3b8bff,#2a6be0);border-color:#6aa6ff;color:#fff}
.seg{display:inline-flex;border:1px solid var(--glass-border);border-radius:10px;overflow:hidden}
.seg button{padding:5px 14px;border:0;background:transparent;font-size:var(--fs-1);font-weight:700}
.seg button[aria-pressed=true]{background:rgba(59,130,246,.55);color:#fff}
.chartbar{display:flex;justify-content:flex-end;margin-bottom:6px}

/* page grid */
.vgrid{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr)}
.vleft{display:grid;gap:var(--gap);align-content:start;min-width:0;grid-template-columns:minmax(0,1fr)}
.field.num input{min-width:0}
.vright{min-width:0}
@media (min-width:1100px){.vgrid{grid-template-columns:minmax(0,1fr) 380px}.vright{position:sticky;top:calc(var(--topbar-h) + 12px);align-self:start}}
.trendgrid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));margin-top:var(--gap)}

/* form */
.entry .field{margin:10px 0}
.field.num .inp{display:flex;align-items:center;gap:8px}
.field.num input,.field select,.field input[type=text],.recal input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(8,20,46,.9);color:var(--text);font:inherit}
.field.num input{max-width:180px;font-size:var(--fs-3);font-weight:700}
.unit{color:var(--text-dim);font-size:var(--fs-1)}
fieldset.sc{border:0;padding:0;margin:10px 0;min-width:0} fieldset.sc legend{font-weight:600;font-size:var(--fs-1);padding:0;margin-bottom:6px}
.scale{display:flex;gap:6px;flex-wrap:wrap;position:relative}
.scale input{position:absolute;opacity:0;width:1px;height:1px}
.scale label{display:inline-grid;place-items:center;min-width:44px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(20,45,90,.4);cursor:pointer;font-weight:700}
.scale input:checked+label{background:linear-gradient(180deg,#3b8bff,#2a6be0);border-color:#6aa6ff;color:#fff}
.scale input:focus-visible+label{box-shadow:var(--focus-ring)}
.scale.wide label{padding:0 14px;font-weight:600}
.field.check{display:flex;align-items:center;gap:10px}
.field.check input{width:20px;height:20px}
.vstrip{min-height:1.3em;margin-top:10px;font-size:var(--fs-1);color:#bff4ff}
.recal{margin-top:10px;display:grid;gap:8px}
.basebox{margin-top:12px;padding-top:10px;border-top:1px solid rgba(120,160,220,.14)}
.basetxt{font-size:var(--fs-1);margin-bottom:8px}
.blog{margin-top:8px;font-size:var(--fs-1);color:var(--text-dim)} .blog ul{margin:6px 0 0;padding-left:18px}

/* pending repeat */
.pend{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,203,61,.5);background:var(--st-watch-bg);font-size:var(--fs-1)}
.pendbox{display:grid;gap:8px}.pendbox:empty{display:none}
.cd{font-family:var(--font-mono)}

/* guide card */
.guide .why{display:grid;gap:6px;justify-items:start;margin-bottom:6px;font-size:var(--fs-1)} .guide h3{margin:12px 0 6px;font-size:var(--fs-2)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:rgba(20,45,90,.28)}
.pgbox{flex:none;width:56px;height:56px;display:grid;place-items:center;border-radius:12px;background:rgba(53,224,255,.07);color:var(--text)}
svg.pg{width:48px;height:48px} svg.pg .ac{stroke:var(--cyan)}
.st{display:grid;gap:2px;font-size:var(--fs-1)} .sn{font-size:var(--fs-0);color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.refrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:var(--fs-1)} .reftext{color:var(--text-dim)} .src{color:var(--text-faint);font-size:var(--fs-0)}
.foot-line{margin-top:12px;padding-top:10px;border-top:1px solid rgba(120,160,220,.14);font-size:var(--fs-1);color:var(--text-dim)}
.guide.flash{animation:flash 1.1s 2}
@keyframes flash{50%{box-shadow:0 0 0 3px rgba(53,224,255,.8)}}
.photo{margin-top:12px;padding:12px;border:1px dashed rgba(160,190,235,.4);border-radius:12px}
.photo label{display:flex;gap:8px;align-items:center;font-weight:600;font-size:var(--fs-1)}
.photo input[type=file]{margin-top:8px;max-width:100%}
.photo-prev{display:block;max-width:100%;max-height:200px;margin-top:10px;border-radius:10px;border:1px solid var(--glass-border)}

/* charts */
.chart{position:relative}
.chartsvg{display:block;width:100%;height:auto;overflow:visible}
.chartsvg:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:8px}
.gl{stroke:var(--chart-grid);stroke-width:1} .gl.v{stroke-dasharray:2 4}
.ax{fill:var(--text-faint);font-size:11px}
.empty{fill:var(--text-dim);font-size:14px}
.band.ref{fill:var(--band-ref)} .band.baseline{fill:var(--band-base)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round} .ln.s1{stroke:var(--series-1)} .ln.s2{stroke:var(--series-2)} .ln.s3{stroke:var(--series-3)}
.mk{stroke:var(--surface-ring);stroke-width:2} .mk.s1{fill:var(--series-1)} .mk.s2{fill:var(--series-2)} .mk.s3{fill:var(--series-3)}
.mk.hollow{fill:var(--surface-ring)!important;stroke-width:2.4} .mk.hollow.s1{stroke:var(--series-1)} .mk.hollow.s2{stroke:var(--series-2)} .mk.hollow.s3{stroke:var(--series-3)}
.cross{stroke:var(--text-dim);stroke-width:1}
.tip{position:absolute;z-index:3;min-width:140px;max-width:240px;padding:8px 10px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--glass-border);font-size:var(--fs-0);pointer-events:none}
.tip .tt{color:var(--text-dim);margin-bottom:4px} .tip .tr{display:flex;align-items:center;gap:6px} .tip strong{font-size:var(--fs-1)} .tip .tl{color:var(--text-dim)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px;font-size:var(--fs-1)}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px} .sw.s1{background:var(--series-1)} .sw.s2{background:var(--series-2)} .sw.s3{background:var(--series-3)}
.chartkey{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:var(--fs-0);color:var(--text-dim)} .ky{display:inline-flex;align-items:center;gap:6px}
.sw-band{width:18px;height:10px;border-radius:3px;border:1px solid rgba(160,190,235,.35)} .sw-band.ref{background:var(--band-ref)} .sw-band.baseline{background:var(--band-base)}
.mk-demo{width:10px;height:10px;border-radius:50%;border:2px solid var(--series-1);background:var(--surface-ring)}
.spark{display:block} .sp-none{stroke:var(--text-faint);stroke-width:2;stroke-dasharray:3 4} .ln.sp{stroke-width:1.8}

/* history table */
.tblwrap{overflow-x:auto} .tbl{width:100%;border-collapse:collapse;font-size:var(--fs-1)}
.tbl th{text-align:left;color:var(--text-dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--glass-border);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid rgba(120,160,220,.1);vertical-align:top} .tbl .ctx{color:var(--text-dim);font-size:var(--fs-0)}

/* dashboard indicator rows */
button.ind.rowbtn{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(120,160,220,.12);color:inherit;
  grid-template-columns:auto minmax(0,1fr) auto;border-radius:8px}
button.ind.rowbtn:hover{background:rgba(53,224,255,.05)}
.rowbtn .val{grid-column:3;grid-row:1;font-size:var(--fs-2);text-align:right}
.rowbtn .meta{grid-column:2;grid-row:2;font-size:var(--fs-0);color:var(--text-faint)}
.rowbtn .tags{grid-column:2;grid-row:3;display:flex;gap:6px;flex-wrap:wrap}
.rowbtn .sparkhost{grid-column:3;grid-row:2/4;justify-self:end;align-self:center}
.rowbtn .ico-wrap{grid-row:1/4}
.rowbtn .chip-status{grid-column:3;justify-self:end}
.stat-row.s-verify{color:var(--tag-sourced)}
.lockbtn,.lockrow{display:inline-flex;align-items:center;gap:10px}
.lockbtn svg.pg{width:36px;height:36px}
.lock .lockbtn{padding:14px 20px;margin:6px 0}
.dashtrend .chartbar{margin-bottom:2px}

/* symptoms */
.symlist{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));margin:10px 0}
.sy{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(20,45,90,.28)}
.sy.p0{border:1px solid rgba(255,85,102,.45)} .sy small{color:#ffb3bb}
.sy select{grid-column:2;padding:6px;border-radius:8px;border:1px solid var(--glass-border);background:rgba(8,20,46,.9);color:var(--text)}
.sy input{width:20px;height:20px}
.symlog{margin:6px 0 0;padding-left:18px;font-size:var(--fs-1)}
@media (max-width:719px){.pgbox{width:48px;height:48px}svg.pg{width:40px;height:40px}.field.num input{max-width:none}}
/* ---- Phase 3: statuses, results, alerts, follow-up, developer panel ---- */
.chip-status.stable{color:var(--st-stable);background:var(--st-stable-bg);border:1px solid rgba(52,232,176,.4)}
.chip-status.watch{color:var(--st-watch);background:var(--st-watch-bg);border:1px solid rgba(255,203,61,.45)}
.chip-status.needs{color:var(--st-needs);background:var(--st-needs-bg);border:1px solid rgba(255,141,50,.5)}
.chip-status.alert{color:#ffb3bb;background:var(--st-alert-bg);border:1px solid rgba(255,85,102,.6)}
.chip-status.verify{color:var(--tag-sourced);background:rgba(120,160,220,.12);border:1px solid rgba(120,160,220,.4)}
.chip-status svg{width:14px;height:14px}
.rowbtn .nmrow{grid-column:2;grid-row:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.assess .chip-status{margin-left:10px;vertical-align:middle}
.res{padding:10px 12px;margin-top:10px;border-radius:12px;border:1px solid var(--glass-border);border-left:4px solid var(--st-nodata)}
.res.sev-watch{border-left-color:var(--st-watch)}.res.sev-needs{border-left-color:var(--st-needs)}.res.sev-alert{border-left-color:var(--st-alert)}.res.sev-stable{border-left-color:var(--st-stable)}
.res p,.alert-item p{margin:6px 0}
.res-s{margin:4px 0}
details.how{margin-top:8px;border:1px solid rgba(120,160,220,.22);border-radius:10px;padding:6px 10px;background:rgba(10,20,40,.35)}
details.how summary{cursor:pointer;font-weight:700;color:var(--cyan)}
details.how ul{margin:6px 0 0;padding-left:18px;color:var(--text-dim)}
.a-alerts .badge-n{margin-left:8px;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--st-alert-bg);color:#ffb3bb;font-size:var(--fs-0);border:1px solid rgba(255,85,102,.5)}
.alert-item{margin:10px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--glass-border);border-left:5px solid var(--st-watch);background:rgba(10,20,40,.35)}
.alert-item.sev-needs{border-left-color:var(--st-needs)}.alert-item.sev-alert{border-left-color:var(--st-alert)}
.alert-item.acked{opacity:.88}
.al-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.al-title{font-size:var(--fs-2)}
.al-msg{font-size:var(--fs-2)}
.al-link{display:flex;gap:8px;align-items:flex-start;color:var(--text-dim);font-size:var(--fs-1)}
.al-link svg{flex:none;width:16px;height:16px;margin-top:2px}
.al-meta{font-size:var(--fs-1);color:var(--text-dim)}
.fup{margin:10px 0;padding:8px 10px;border-radius:10px;border:1px dashed rgba(120,160,220,.4)}
.fup-h{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--cyan)}
.fup-h svg{width:16px;height:16px}
.fup-time{color:var(--text-dim);font-size:var(--fs-1)}
.fup-eval{margin-top:8px;padding-top:8px;border-top:1px solid rgba(120,160,220,.2)}
.fup-eval .ba{font-weight:700}
.alert-history{margin-top:12px}
.alert-history summary{cursor:pointer;color:var(--text-dim)}
.linkseg{margin:8px 0}
.stat-row .n{min-width:1.5em;text-align:right}
/* developer panel */
.page.dev{max-width:1400px}
.dv-grid{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:var(--gap);align-items:start;margin-top:12px}
.dv-col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.dv-card .dv-f{display:flex;flex-direction:column;gap:3px;margin:8px 0;font-size:var(--fs-1)}
.dv-card input,.dv-card select{padding:6px 8px;border-radius:8px;border:1px solid var(--glass-border);background:rgba(10,20,40,.6);color:var(--text);font:inherit}
.dv-card input[type=checkbox]{width:20px;height:20px}
.dv-sep{height:1px;background:rgba(120,160,220,.2);margin:12px 0}
.dv-row{display:flex;flex-wrap:wrap;gap:8px}
.dv-scroll{overflow:auto;max-height:640px;margin-top:10px}
.dv-t{width:100%;border-collapse:collapse;font-size:var(--fs-0);margin-top:10px}
.dv-t th,.dv-t td{border:1px solid rgba(120,160,220,.2);padding:5px 7px;text-align:left;vertical-align:top}
.dv-t th{position:sticky;top:0;background:#101b33;z-index:1}
.dv-tests tr.pass td:last-child{color:var(--st-stable);font-weight:700}
.dv-tests tr.fail td{background:var(--st-alert-bg)}.dv-tests tr.fail td:last-child{color:#ffb3bb;font-weight:700}
.dv-pass{color:var(--st-stable);font-weight:700}.dv-fail{color:#ffb3bb;font-weight:700}
.dv-em{color:#ffb3bb;font-weight:700}
@media (max-width:900px){.dv-grid{grid-template-columns:1fr}}
/* ===== END STYLE: VITALS ===== */

.tabs.more{margin-top:0}.tabs.more button{background:rgba(20,45,90,.25);border-style:dashed}.tabs.more button[aria-selected=true]{border-style:solid}.moreh{margin:6px 0 4px}
.a-more{margin-top:10px;border-top:1px solid var(--glass-border);padding-top:8px}.a-more summary{cursor:pointer;font-weight:700}
.xrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 6px;border-radius:10px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.06)}
.xrow .nm{font-weight:600;min-width:7rem}.xrow .v{color:var(--muted,#9fb4d4);flex:1}

.rcbox{margin:0 0 12px;padding:10px;border:1px dashed var(--glass-border);border-radius:12px}.rc-label{margin:0 0 6px}
.rc-circle{display:block;margin:10px auto;width:150px;height:150px;border-radius:50%;border:3px solid #6aa6ff;background:rgba(20,45,90,.5);color:#fff;font-weight:700;font-size:var(--fs-1)}
.rc-circle[data-state=go]{background:#1f9d55;border-color:#7ce0a3}.rc-circle[data-state=wait]{background:rgba(60,70,90,.7);border-color:#8aa0c0}
.rc-out{min-height:1.5em;text-align:center;margin:4px 0}
/* ===== STYLE: BODY_MAP ===== */
/* Phase 4: body map figure, callouts, zone card. Status colour is always paired with an icon and a word. */
.body-card{container-type:inline-size;container-name:bmcard}
.bodymap{display:block}
.bm-stage{position:relative;max-width:640px;margin:0 auto}
.bm-clip{position:relative;aspect-ratio:560/640;width:100%}
.bm-svg{display:block;width:100%;height:100%;overflow:visible}
.bm-halo ellipse{fill:none;stroke:rgba(53,224,255,.15);stroke-width:1.2}
.bm-halo .d{stroke-dasharray:2 9;stroke:rgba(53,224,255,.26)}
.bm-fig .sil{fill:url(#bmFill);stroke:none}
.bm-fig .rim{fill:none;stroke:url(#bmEdge);stroke-width:2.2;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(53,224,255,.7))}
.bm-fig .face{fill:none;stroke:rgba(180,240,255,.34);stroke-width:1.2;stroke-linecap:round}
.bm-fig .scan{animation:bmScan 7s linear infinite}
@keyframes bmScan{from{transform:translateY(-80px)}to{transform:translateY(660px)}}
.bm-int path{fill:none;stroke:rgba(150,230,255,.2);stroke-width:1.4;stroke-linecap:round}
.bm-int .vert rect{fill:rgba(150,230,255,.11);stroke:none}
.bm-int .lym{stroke-dasharray:3 5;stroke:rgba(150,230,255,.16)}
.bm-leaders path{fill:none;stroke:rgba(150,170,205,.42);stroke-width:1.2;stroke-linejoin:round}
.bm-leaders path.is-hot{stroke:var(--cyan);stroke-width:1.8}
/* zones */
.zone{--zc:var(--st-nodata);cursor:pointer;outline:none}
.zone[data-status=stable]{--zc:var(--st-stable)}
.zone[data-status=watch]{--zc:var(--st-watch)}
.zone[data-status=needs]{--zc:var(--st-needs)}
.zone[data-status=alert]{--zc:var(--st-alert)}
.zone .zf{fill:var(--zc);fill-opacity:.30;stroke:var(--zc);stroke-width:2;stroke-linejoin:round;transition:fill-opacity var(--dur) var(--ease)}
.zone[data-status=nodata] .zf,.zone[data-status=verify] .zf{stroke-dasharray:5 3;fill-opacity:.2}
.zone .zl{fill:none;stroke:var(--zc);stroke-opacity:.85;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.zone .hit{fill:transparent;stroke:transparent;stroke-width:18;pointer-events:all}
.zone .bw{fill:none;stroke:var(--zc);stroke-opacity:.26;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.zone .bc{fill:none;stroke:var(--zc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.zone .bj{fill:var(--zc);fill-opacity:.35;stroke:var(--zc);stroke-width:1.6}
.zone .mu{fill:var(--zc);fill-opacity:.10;stroke:none}
.zone.is-hot .zf,.zone.is-open .zf{fill-opacity:.5}
.zone.is-hot .bw,.zone.is-open .bw{stroke-opacity:.45}
.zone.is-hot .mu,.zone.is-open .mu{fill-opacity:.2}
.zone.is-open{filter:drop-shadow(0 0 7px var(--zc))}
.zone.is-open .zf,.zone.is-open .mu{animation:bmPulse 2.6s ease-in-out infinite}
@keyframes bmPulse{0%,100%{fill-opacity:.32}50%{fill-opacity:.6}}
.zone.is-forced .zf{stroke-dasharray:2 3}
/* callouts */
.bm-calls{position:absolute;inset:0;pointer-events:none}
.bm-pill{--pc:var(--st-nodata);position:absolute;top:calc(var(--y) / 640 * 100%);transform:translateY(-50%);width:25.5%;min-height:46px;pointer-events:auto;display:flex;align-items:center;gap:7px;text-align:left;
  padding:6px 8px;border-radius:12px;background:rgba(9,22,48,.92);border:1px solid var(--pc);color:var(--text);transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.bm-pill.side-l{left:0}.bm-pill.side-r{right:0}
.bm-pill[data-status=stable]{--pc:var(--st-stable)}.bm-pill[data-status=watch]{--pc:var(--st-watch)}.bm-pill[data-status=needs]{--pc:var(--st-needs)}.bm-pill[data-status=alert]{--pc:var(--st-alert)}
.bm-pill .ico-wrap{color:var(--pc);flex:none;display:grid;place-items:center}
.bm-pill .ico-wrap svg{width:18px;height:18px}
.bm-pill .pt{display:grid;gap:1px;min-width:0}
.bm-pill .nm{font-weight:650;font-size:var(--fs-1);line-height:1.15}
.bm-pill .stt{font-size:var(--fs-0);color:var(--text-dim);line-height:1.2}
.bm-pill:hover,.bm-pill.is-hot,.bm-pill.is-open{background:rgba(18,42,84,.96);box-shadow:0 0 12px -2px var(--pc)}
.bm-pill.is-open{border-width:2px}
.bm-pill:focus-visible{outline:none;box-shadow:var(--focus-ring)}
@container bmcard (max-width:399px){
  .bm-clip{aspect-ratio:310/640;width:min(100%,232px);margin:0 auto;overflow:hidden}
  .bm-svg{position:absolute;top:0;left:-40.3%;width:180.6%;height:100%}
  .bm-calls{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;pointer-events:auto}
  .bm-pill{position:static;transform:none;width:auto}
  .bm-leaders{display:none}
}
/* off-map entities and the zone card */
.bm-off[hidden]{display:none}
.bm-off{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:12px;font-size:var(--fs-0)}
.bm-offchip{--pc:var(--st-nodata);display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--pc);background:rgba(9,22,48,.8);font-size:var(--fs-0)}
.bm-offchip[data-status=stable]{--pc:var(--st-stable)}.bm-offchip[data-status=watch]{--pc:var(--st-watch)}.bm-offchip[data-status=needs]{--pc:var(--st-needs)}.bm-offchip[data-status=alert]{--pc:var(--st-alert)}
.bm-offchip svg{width:14px;height:14px;color:var(--pc)}
.bm-detail{--pc:var(--st-nodata);margin-top:12px;padding:12px 14px;border:1px solid rgba(120,160,220,.28);border-left:4px solid var(--pc);border-radius:var(--radius-sm);background:rgba(8,20,46,.72)}
.bm-detail[data-status=stable]{--pc:var(--st-stable)}.bm-detail[data-status=watch]{--pc:var(--st-watch)}.bm-detail[data-status=needs]{--pc:var(--st-needs)}.bm-detail[data-status=alert]{--pc:var(--st-alert)}
.bm-dh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bm-detail h3{margin:0;font-size:var(--fs-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bm-detail h3:focus{outline:none}.bm-detail h3:focus-visible{box-shadow:var(--focus-ring);border-radius:6px}
.bm-detail h4{margin:12px 0 4px;font-size:var(--fs-1);color:var(--text-dim);font-weight:650}
.bm-detail p{margin:4px 0}
.bm-inds{list-style:none;margin:0;padding:0}
.bm-ind{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:6px 0;border-bottom:1px solid rgba(120,160,220,.12)}
.bm-ind:last-child{border-bottom:0}
.bm-ind .nm{font-weight:600;flex:1 1 120px}
.bm-ind .val{color:var(--text)}
.bm-checks{margin-top:10px;gap:8px}
.bm-res{margin-top:8px;padding-top:6px;border-top:1px dashed rgba(120,160,220,.25)}
.bm-meta{margin-top:10px}
.bm-disc{font-style:italic}
.note.forced{color:var(--st-watch)}
.dv-forcegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:8px 0}
.dv-forcegrid label{display:grid;gap:4px;font-size:var(--fs-1)}
@media (prefers-reduced-motion:reduce){.bm-fig .scan,.zone.is-open .zf,.zone.is-open .mu{animation:none!important}}
/* ===== END STYLE: BODY_MAP ===== */
/* ===== STYLE: VIVA ===== */
/* Phase 5: Viva's panel (robot states, bubbles with Listen, value form, Ask box, voice row). Motion is off under prefers-reduced-motion (TOKENS). */
.viva-robot .eyes-c,.viva-robot .brows,.viva-robot .m-con,.viva-robot .m-talk{display:none}
.viva-robot[data-concern="1"] .eyes-h{display:none}
.viva-robot[data-concern="1"] .eyes-c,.viva-robot[data-concern="1"] .brows{display:inline}
.viva-robot[data-state="talking"] .m-idle,.viva-robot[data-state="concerned"] .m-idle{display:none}
.viva-robot[data-state="talking"] .m-talk{display:inline;transform-box:fill-box;transform-origin:center;animation:vmouth .32s ease-in-out infinite alternate}
.viva-robot[data-state="concerned"] .m-con{display:inline}

/* Phase 10A: Mission Day Briefing card (Vivo.Briefing). Read-only summary at the top of the Dashboard.
   The card is the first row of the Dashboard grid. These templates repeat the three Dashboard templates of UI_LAYOUT.css with one extra "brief" row,
   and only apply while the card is drawn (.has-brief). No animation is used, so reduced motion needs no special case. */
.dash.has-brief{grid-template-areas:"brief brief brief" "status body viva" "inds body viva" "inds body alerts" "trends tasks emerg"}

@media (max-width:1099px){ .dash.has-brief{grid-template-areas:"brief brief" "viva status" "viva inds" "body inds" "body alerts" "trends trends" "tasks emerg"} }

.vbadge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:var(--fs-0);border:1px solid var(--glass-border)}
.vbadge.working{color:#ffe27a;border-color:#ffe27a88}
.vbadge.prototype{color:#7fe8ff;border-color:#7fe8ff88}
.vbadge.roadmap{color:var(--text-dim);border-style:dashed}
.vcard .vstatus{color:var(--text-dim)}
/* ===== END STYLE: GUIDED_DEMO ===== */
/* ===== STYLE: TASKS ===== */
.tcount{display:flex;align-items:baseline;gap:6px;font-size:var(--fs-1);color:var(--text-dim)}
.tcount strong{font-size:var(--fs-4,1.6rem);color:var(--text);font-weight:700}
.tprog,.lbar{display:block;height:8px;border-radius:999px;background:rgba(120,160,220,.18);overflow:hidden;margin:6px 0 10px}
.tfill,.lfill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#35e0ff,#5aa2ff);transition:width .35s ease}
.tlist,.llist{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(120,160,220,.12)}
.task:last-child{border-bottom:0}
.task .tk-ico{width:22px;height:22px;display:grid;place-items:center;color:var(--text-faint)}
.task.done .tk-ico{color:var(--st-stable)}
.task .tk-name{font-weight:600;font-size:var(--fs-1)}
.task .tk-state{font-size:var(--fs-0);color:var(--text-faint)}
.task.done .tk-state{color:var(--st-stable)}
.btn.small{padding:5px 11px;font-size:var(--fs-0);border-radius:10px}
.tweek{margin-top:12px}
.wstrip{display:flex;gap:6px;margin:6px 0}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:30px}
.wd .dot{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(160,190,235,.5);display:grid;place-items:center;color:#06203a;background:transparent}
.wd.on .dot{background:linear-gradient(135deg,#7bf0ff,#4a9bff);border-color:transparent}
.wd .dot svg{width:16px;height:16px}
.wd.today .dot{box-shadow:0 0 0 2px rgba(53,224,255,.45)}
.wd .dn{font-size:var(--fs-0);color:var(--text-faint)}
.note.kind{color:var(--text)}
.lrow{display:grid;grid-template-columns:minmax(110px,1.2fr) 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(120,160,220,.12)}
.lrow:last-child{border-bottom:0}
.lrow .lbar{margin:0}
.lrow.set .ls{color:var(--st-stable)}
.lrow .ls{font-size:var(--fs-0);color:var(--text-dim);white-space:nowrap}
.learnline{margin-top:10px}
@media (max-width:520px){.lrow{grid-template-columns:1fr auto}.lrow .lbar{grid-column:1/3;order:3}.task{grid-template-columns:auto 1fr auto}.task .tk-state{display:none}}
.a-tasks.pulse{animation:tpulse 1.6s ease-out 1}
@keyframes tpulse{0%{box-shadow:0 0 0 0 rgba(53,224,255,.7)}100%{box-shadow:0 0 0 18px rgba(53,224,255,0)}}
@media (prefers-reduced-motion:reduce){.tfill,.lfill{transition:none}.a-tasks.pulse{animation:none;box-shadow:0 0 0 2px rgba(53,224,255,.6)}}
.goal{padding:8px 0;border-bottom:1px solid rgba(120,160,220,.12)}
.goal h3{font-size:var(--fs-2,1.05rem);margin-bottom:4px}
.goalform{display:grid;grid-template-columns:1fr 110px;gap:8px 12px;align-items:center;margin-top:12px}
.goalform label{font-size:var(--fs-1);color:var(--text-dim)}
.goalform input{width:100%;padding:7px 9px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(10,25,55,.7);color:var(--text);font:inherit}
.goalform .row{grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap}
.wstrip.nights .wd.part .dot{border-style:dashed}
.wstrip.nights .dn{font-size:var(--fs-0)}
.tl{list-style:none;margin:0;padding:0}
.tl-day{margin:12px 0 4px;font-size:var(--fs-0);letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
.tl-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:6px 0;border-bottom:1px solid rgba(120,160,220,.1)}
.tl-ico{width:22px;height:22px;display:grid;place-items:center;color:var(--cyan)}
.tl-text{font-size:var(--fs-1)}
.tl-time{font-size:var(--fs-0);color:var(--text-faint);white-space:nowrap}
.timeline .btn{margin-top:10px}
/* ===== END STYLE: TASKS ===== */
/* ===== STYLE: SOURCES ===== */
.sources-page{display:grid;gap:var(--gap)}
.sources-page h3{font-size:var(--fs-2);margin:12px 0 4px;color:var(--text)}
.src-sec:focus{outline:none}
.src-sec:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.src-tocbtns{display:flex;flex-wrap:wrap;gap:6px}
.src-list{margin:4px 0 0;padding-left:20px;display:grid;gap:6px}
.src-basis{color:var(--text-faint);font-size:var(--fs-0)}
.src-more,.src-group{margin-top:8px;border:1px solid rgba(120,160,220,.18);border-radius:10px;padding:8px 10px}
.src-more>summary,.src-group>summary{cursor:pointer;min-height:32px;display:flex;align-items:center;gap:6px}
.src-refs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.src-refs li{overflow-wrap:anywhere}
.src-link{color:var(--cyan);font-size:var(--fs-0);overflow-wrap:anywhere;word-break:break-word}
.tblwrap{overflow-x:auto;margin-top:8px}
.src-table{border-collapse:collapse;width:100%;font-size:var(--fs-1)}
.src-table th,.src-table td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(120,160,220,.15);vertical-align:top}
.src-table th{color:var(--text-dim);font-weight:600}
</style>
</head>

/* SIMULATED data for the demo profiles. Nothing here is a real measurement.
   Two datasets for 124 mission days:
     steady = the default dashboard (normal variation around a stable personal baseline, no alerts)
     drift  = for demo scenario 2 (heart rate rising, sleep falling, fatigue rising over the last 14 days)

Vivo.DemoData = (function () {
  var DAY = 86400000, DRIFT_DAYS = 14;

  // small seeded generator so the same profile always gets the same believable data
  function prng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0; var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }
  function r1(x) { return Math.round(x * 10) / 10; }

  var PROFILES = {
    mark:      { hr: 64, sys: 118, dia: 76, spo2: 98, temp: 36.7, mass: 78.4, sleep: 7.0, quality: 4, mood: 4, stress: 2, fatigue: 2, exercise: 100 },
    sebastian: { hr: 61, sys: 112, dia: 72, spo2: 98, temp: 36.6, mass: 82.0, sleep: 7.3, quality: 4, mood: 4, stress: 2, fatigue: 2, exercise: 90 }
  };

  // offsets (minutes before the day's anchor time) so readings of one day are not all at the same second

  function generate(crewKey, set, nowMs, missionDay) {
    var P = PROFILES[crewKey] || PROFILES.mark, rnd = prng(hash(crewKey + ':' + set)), out = [];
    function gauss() { var u = 1 - rnd(), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
    function pick1to5(mean, spreadChance) { var x = mean + (rnd() < spreadChance ? (rnd() < 0.5 ? -1 : 1) : 0); return clamp(Math.round(x), 1, 5); }

    var anchor = nowMs - 2 * 3600000;               // newest daily reading is about 2 hours old
    var dose = 0, N = missionDay;

    for (var d = 1; d <= N; d++) {
      var tDay = anchor - (N - d) * DAY;
      var f = (set === 'drift' && d > N - DRIFT_DAYS) ? (d - (N - DRIFT_DAYS)) / DRIFT_DAYS : 0;     // 0..1 over the drift window

          confidence: 'Simulated', confirmed: true, ctx: extra || {} });
      }

      // heart rate (rises in the drift set)
      var hr = Math.round(clamp(P.hr + gauss() * 2.2 + 18 * f, 50, 110));
      push('hr', { v: hr }, { rested: true, exercise30: false });
      // blood pressure
      push('bp', { sys: Math.round(clamp(P.sys + gauss() * 3 + 2 * f, 100, 119)), dia: Math.round(clamp(P.dia + gauss() * 2.5 + 1 * f, 62, 79)) },
        { rested: true, exercise30: false, posture: 'sitting' });
      // SpO2
      push('spo2', { v: clamp(Math.round(P.spo2 + gauss() * 0.7), 96, 100) }, { rested: true });
      // temperature
      push('temp', { v: r1(clamp(P.temp + gauss() * 0.12, 36.2, 37.2)) }, { rested: true, method: 'mouth' });
      // body mass, weekly
      if (d % 7 === 1) push('mass', { v: r1(P.mass - 0.004 * d + gauss() * 0.25) }, { method: 'secured device' });

      var hours = r1(clamp(P.sleep + gauss() * 0.45 - (P.sleep - 5.4) * f, 4.2, 9));
      push('sleep', { hours: hours, quality: clamp(Math.round(P.quality + gauss() * 0.5 - 1.5 * f), 1, 5), sleepy: clamp(Math.round(2 + gauss() * 0.5 + 1.5 * f), 1, 5) });
      // mood, stress, fatigue (private)
      push('mood', { mood: clamp(pick1to5(P.mood, 0.2) - Math.round(f), 1, 5), stress: clamp(pick1to5(P.stress, 0.2) + Math.round(f), 1, 5), fatigue: clamp(pick1to5(P.fatigue, 0.15) + Math.round(2 * f), 1, 5) });
      // exercise (one rest day per week)
      push('exercise', { minutes: d % 7 === 0 ? 0 : Math.round(clamp(P.exercise + gauss() * 12, 50, 150)) });

      dose += 1.5 + (rnd() - 0.5) * 0.2;
      push('radiation', { msv: r1(dose) });

      // a few extra readings in the last 3 days so the 1D chart shows more than one point
      if (d > N - 3) {
        [7, 13, 19].forEach(function (h) {
          var hh = h * 3600000;

          out.push({ ind: 'spo2', values: { v: clamp(Math.round(P.spo2 + gauss() * 0.7), 96, 100) }, ts: ts('spo2', hh), missionDay: d, source: 'simulated', confidence: 'Simulated', confirmed: true, ctx: { rested: true } });

        });
      }
    }
    out.sort(function (a, b) { return new Date(a.ts) - new Date(b.ts); });
    return out;
  }

  return { generate: generate, DRIFT_DAYS: DRIFT_DAYS, SETS: [{ key: 'steady', label: 'Steady (default dashboard)' }, { key: 'drift', label: 'Drift (heart rate up, sleep down, fatigue up)' }] };
})();

     provisional . unconfirmed (typed outside the limits and confirmed): can drive a status up to Watch only, never Stable
     held ........ saved as "Needs verification" while the context check or the repeat is open: status stays as it was
     stale ....... measured long ago: no alert from it
     superseded .. a repeat settled it: kept in the history, no longer drives anything

  function rDizzy(c, out) {                                    // GRV-4: dizzy or faint on standing in a gravity environment (the Moon or Mars). Status is capped at Watch; it escalates only when the report repeats, or another worrying symptom was logged (a P0 or concerning symptom; P0 symptoms also open the emergency screen on their own path).

  function rPattern(c, out) {                                  // MUL-1: heart rate up + sleep down + fatigue up (multi-indicator, new DEMO rule)

  function rRadiation(c, out) {

  /* ---------- per-indicator data flags (fresh valid, held, provisional) ---------- */
  function flags(p, env) {

      var arr = (p.readings || []).filter(function (r) { return r.ind === d.id; }).map(function (r) { return { r: r, t: Date.parse(r.ts), k: kindOf(r) }; }).filter(function (e) { return e.t <= now + MIN; }).sort(byT);

  /* ---------- evaluate (PURE) ---------- */
  function evaluate(p, env) {
    env = env || {}; env.nowMs = env.nowMs != null ? env.nowMs : Date.now(); env.mission = env.mission || {};
    var res = { at: env.nowMs, profileId: p.id || null, results: [], emergency: null, ents: {}, data: flags(p, env), link: env.mission.link || 'delayed', counts: null, summary: null };
    var c1 = makeCtx(p, env, false), r1 = runAll(c1);
    var hasProv = C.ALL.some(function (d) { return res.data[d.id].prov; });
    var all = r1.slice(), em = c1.emerg.slice();
    if (hasProv) {                                             // second pass: provisional (unconfirmed) readings count, but never above Watch

      r2.forEach(function (x) {

        if (same) { if (sev(x.status) > sev(same.status) && sev(same.status) < 1 && !x.info) { x.status = 'watch'; x.capped = true; x.provisional = true; all[all.indexOf(same)] = x; } return; }
        if (x.info) return;

    }

    all.forEach(function (x) { x.link = linkLine(res.link); x.demo = x.type.indexOf(T.D) >= 0; x.base = x.status; });
    all.sort(function (a, b) { return (sev(b.status) - sev(a.status)) || (a.info ? 1 : 0) - (b.info ? 1 : 0) || (a.rule < b.rule ? -1 : 1); });

    var prio = { 'EMG-1': 0, 'VIT-3': 1, 'VIT-5': 1 };
    em.sort(function (a, b) { return (prio[a.source] - prio[b.source]) || (b.tsMs - a.tsMs); });
    res.emergency = em[0] || null; res.emergencies = em;
    summarize(res, p, env);

  }

  function linkLine(state) {
    var id = state === 'live' ? 'WRN-26' : state === 'blackout' ? 'WRN-28' : 'WRN-27';
    return { id: id, state: state, text: V().line(id, { minutes: C.LINK.delayed.minutes }) };
  }

  /* ---------- entities, counts, summary (also called again after a follow-up raised a status) ---------- */
  function summarize(res, p, env, hide) {
    hide = hide || [];
    var ids = C.INDICATORS.map(function (d) { return d.id; }).concat(['symptoms']).concat(C.EXTRAS.map(function (d) { return d.id; })), counts = { stable: 0, watch: 0, needs: 0, alert: 0, nodata: 0, verify: 0, hidden: hide.length };
    counts.hiddenP0 = hide.filter(function (id) { var d = C.indicator(id); return !(d && d.p1); }).length;      // the hidden P1 checks are optional: only P0 hides change the "all measured" arithmetic
    var symRecent = (p && p.symptoms ? p.symptoms : []).some(function (s) { return env && Date.parse(s.ts) >= env.nowMs - R.symptomRecentH * HOUR; });
    ids.forEach(function (id) {
      if (hide.indexOf(id) >= 0) {                              // PRV-1: a hidden private indicator is not assessed in this view, not counted, and not listed as missing
        res.ents[id] = { id: id, status: null, hidden: true, results: [], fresh: false, pendingVerify: false, provisional: false, any: true };
        return;
      }
      var list = res.results.filter(function (x) { return x.ents.indexOf(id) >= 0; }), real = list.filter(function (x) { return !x.info; });
      var fl = res.data[id] || { freshValid: false, held: false, prov: false, any: false }, status, pendingVerify = false;
      if (real.length) status = real.reduce(function (m, x) { return sev(x.status) > sev(m) ? x.status : m; }, 'watch');
      else if (id === 'symptoms') status = symRecent ? 'stable' : null;
      else if (fl.freshValid && !fl.prov) { status = 'stable'; pendingVerify = fl.held; }
      else if (fl.prov || fl.held) status = 'verify';
      else status = 'nodata';
      if (real.length && (fl.held)) pendingVerify = true;
      var dd = C.indicator(id), p1 = !!(dd && dd.p1);
      if (p1 && status === 'stable' && dd.noRule && !list.length) status = 'recorded';        // no rule exists for it: shown as "Recorded", never as Stable
      res.ents[id] = { id: id, status: status, results: list, fresh: fl.freshValid, pendingVerify: pendingVerify, provisional: !!fl.prov, any: fl.any };
      if (status && !(p1 && (status === 'nodata' || status === 'recorded'))) counts[status]++;     // an optional check with no data, or no rule, is not counted
    });
    res.counts = counts;
    res.summary = summaryLine(res);
  }

/* Phase 7: the Guided Demo (PROJECT_BRIEF section 11). Three scripted scenarios on SIMULATED data:

   - The demo runs on a scratch copy. Before it starts, the whole app state is copied (Vivo.Data.snapshot). When a scenario ends, is skipped or is replayed,
     and when the demo ends or is closed, that copy is put back exactly (Vivo.Data.restore). Nothing the demo does is written to storage while it runs (Vivo.Data.hold).
   - Voice is off unless the person said yes to "Play with voice?". Nothing speaks at load.
   - The demo uses no Blood results and no free-text Ask Viva. Viva's own context-check questions are answered for Mark by the demo, visibly (the chips are clicked).
   - Captions always show. A progress strip shows the three scenarios. Pause, Skip, Replay and Close are always available. */

  var CHIP_PREF = { 'CTX-02': 'No', 'CTX-03': 'Sitting', 'CTX-04': 'Yes', 'CTX-05': 'First', 'CTX-06': 'None' };   // answers given for Mark in the context check

  /* ---------- timing: a sleep that honours Pause and stops at once when the run token changes ---------- */

// Dashboard-first entry: no welcome screen, no launch overlay. Viva's panel carries the greeting; Help (?) is optional and never opens by itself.
Vivo.Onboarding = (function () {
  var V = Vivo.Viva, D = Vivo.Data, C = Vivo.Config;
  var helpEls = null, helpOpener = null;

  function defaultChips() { return V.defaultChips(); }          // Phase 5: the dialogue manager owns the chips and the greeting
  function greet() { V.greet(); }
  function startHealthCheck() {
    V.you('Start a Health Check');
    V.say('FTE-06');
    V.setChips(C.CREW.map(function (c) { return { label: c.name, onClick: function () { chooseCrew(c.key); } }; })
      .concat([{ label: 'Back', onClick: function () { V.setChips(defaultChips()); } }]));
  }
  function chooseCrew(key) {
    V.you(C.crew(key).name);
    D.createProfile(key, 'new');
    D.switchProfile(key + '-new', 'healthcheck');   // opens a NEW empty profile (FTE-10, FTE-11 follow from the bus handler)
  }
  function askViva() { V.openAsk(); }

  Vivo.bus.on('profile:switched', function (e) {
    var p = D.getProfile(e.id);
    if (e.reason === 'healthcheck') { V.say('FTE-10'); V.say('FTE-11'); }
    else { V.say('CAR-05', { fullname: p.name }); V.say(p.kind === 'demo' ? 'CAR-04' : 'EMP-08'); }
    V.setChips(e.reason === 'healthcheck' ? [{ label: 'Open Vitals', primary: true, onClick: function () { V.you('Open Vitals'); Vivo.UI.route('vitals'); } }].concat(defaultChips()) : defaultChips());
  });

  /* ---- Help (?) panel: optional, dismissible ---- */
  function openHelp(opener) {
    if (helpEls) return;
    var h = Vivo.UI.h, ic = Vivo.UI.icon, L = V.line;
    helpOpener = opener || document.activeElement;
    var closeBtn = h('button', { class: 'btn round ghost x', type: 'button', 'aria-label': 'Close help', onclick: closeHelp }, h('span', { html: ic('close') }));
    var scrim = h('div', { class: 'scrim', onclick: closeHelp });
    var drawer = h('aside', { class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'helpTitle' },
      closeBtn,
      h('h2', { id: 'helpTitle' }, L('FTE-01')), h('p', { class: 'muted' }, L('FTE-01b')), h('p', null, L('WEL-12')),
      h('h3', null, 'About Viva'), h('p', null, L('FTE-02')), h('p', null, L('FTE-03')),
      h('h3', null, 'Your daily check'), h('p', null, L('WEL-03')),
      h('h3', null, 'Privacy'), h('p', null, L('WEL-04')),
      h('h3', null, 'Demo data'), h('p', null, L('FTE-05')), h('p', null, L('CAR-04')), h('p', null, L('FTE-07')), h('p', null, L('FTE-08')),
      h('h3', null, 'Guided Demo'), h('p', null, L('FTE-04')),
      h('h3', null, 'Voice'), h('p', null, L('VOX-02')), h('p', null, L('VOX-04')));
    document.body.append(scrim, drawer);
    helpEls = [scrim, drawer];

    closeBtn.focus();

/* Hidden developer panel (open with #/dev in the address bar, or Ctrl+Shift+D). Not in the navigation, not part of the crew experience.
   1. Inject values: readings (valid, unconfirmed, held), symptoms, solar particle event, link state, mission day, clock.
   2. Live view of what the rules engine returns for the active profile.
   3. Unit-test list: every implemented rule has fixtures with the rule ID, the input, the expected result and the actual result.
   4. Rules of the catalogue that are not built yet (their indicator does not exist) and why.
   The fixtures run on scratch profiles through the same pure evaluate() the app uses. They never touch the crew data. */

      return h('div', { class: 'stat-row s-' + k, 'data-status': k }, h('span', { html: icon(s.icon) }), h('span', null, s.label), h('span', { class: 'n' }, String(counts[k])));
    });
    if (counts.verify > 0) rows.push(h('div', { class: 'stat-row s-verify', 'data-status': 'verify', title: 'A reading waits for a repeat or a context check. It does not change any status yet.' }, h('span', { html: icon('tasks') }), h('span', null, 'Needs verification (waiting for a repeat)'), h('span', { class: 'n' }, String(counts.verify))));
    var view = Vivo.Rules.view(p.id), sum = view.summary;
    if (counts.hidden > 0) rows.push(h('div', { class: 'stat-row s-private', 'data-private-note': 'status' }, h('span', { html: icon('eye') }), h('span', null, 'Private indicator hidden, not counted'),
      h('button', { class: 'btn ghost small lockrow', type: 'button', onclick: function () { Vivo.Rules.reveal(); } }, V.line('PRV-01'))));
    return card('a-status', 'hStatus', 'Monitoring Status', 'vitals', rows,
      h('p', { class: 'note sumline', 'data-summary': sum.id }, sum.text),
      p.kind === 'demo' ? h('p', { class: 'note' }, Vivo.Guide.tag('SIM'), ' ' + V.line('CAR-04')) : h('p', { class: 'note' }, V.line('EMP-02')));
  }
  function indicatorsCard(p) {
    var rows = C.INDICATORS.map(function (ind) { return Vivo.Vitals.indicatorRow(p, ind, function (id) { Vivo.Vitals.open(id); }); });
    if (C.EXTRAS.length) rows.push(Vivo.Vitals.moreCard(p));
    return card('a-inds', 'hInds', 'Indicators', 'heart', rows);
  }
  function bodyCard(p) {
    var wrap = h('div');
    Vivo.BodyMap.render(wrap, p);
    return h('section', { class: 'card a-body body-card', 'aria-labelledby': 'hBody' }, h('h2', { id: 'hBody' }, h('span', { html: icon('lungs') }), 'Body map'), wrap);
  }
  function vivaCard() {
    var wrap = h('div');
    var sec = h('section', { class: 'card a-viva', 'aria-label': 'Viva, your health companion' }, wrap);
    V.mountPanel(wrap);
    return sec;
  }
  function trendsCard(p) {
    var host = h('div', { class: 'dashtrend' }), sec = card('a-trends', 'hTrends', 'Trends', 'trends', host);
    if (!D.readingsFor('hr', p.id).length) host.append(h('p', { class: 'muted' }, V.line('EMP-03')), h('p', { class: 'note' }, V.line('EMP-04')));
    else Vivo.Vitals.dashTrend(host, p.id);
    return sec;
  }
  function dashboard(main) {
    var p = D.getActiveProfile(), counts = D.statusCounts(), brief = Vivo.Briefing.render();      // Phase 10A: the briefing card (null while the Guided Demo runs)
    main.append(h('div', { class: 'dash' + (brief ? ' has-brief' : '') }, brief,
      statusCard(p, counts), indicatorsCard(p), bodyCard(p), vivaCard(),
      Vivo.Followup.renderCard(),
      trendsCard(p),
      Vivo.Tasks.dashCard(),
      card('a-emerg', 'hEmerg', 'Emergency', 'siren', h('p', { class: 'muted' }, 'Open the Emergency Center any time.'),
        h('div', { style: 'margin-top:12px' }, h('button', { class: 'btn emergency', type: 'button', style: 'width:100%', onclick: function () { refs.emergencyAction(); } }, h('span', { html: icon('siren') }), h('span', null, 'Emergency access'))))));
  }
  function demoCard() {
    var p = D.getActiveProfile(), box = h('section', { class: 'card', 'aria-label': 'Demo data' }, h('h2', null, h('span', { html: icon('planet') }), 'Demo data'));
    if (p.kind !== 'demo') {
      box.append(h('p', { class: 'muted' }, 'Demo data belongs to the demo profiles. This is a new profile, so it only holds what you enter. Switch to a demo profile to load simulated data.'));
      return box;
    }
    box.append(h('p', { class: 'muted' }, '124 days of simulated readings for ' + p.name + '. ', Vivo.Guide.tag('SIM'), ' Nothing here is real. Loading replaces this demo profile\'s readings and baselines. Your new profiles are not touched.'));
    var msg = h('p', { class: 'note', role: 'status' }, 'Loaded now: ' + (p.dataset === 'drift' ? 'Drift' : 'Steady') + '.');
    var row = h('div', { class: 'row' }, Vivo.DemoData.SETS.map(function (set) {
      return h('button', { class: 'btn' + (p.dataset === set.key ? ' primary' : ''), type: 'button', 'data-set': set.key, onclick: function () {
        D.loadDemoData(p.id, set.key); V.say('SYS-16', { set: set.key === 'drift' ? 'drift' : 'steady' }); msg.textContent = 'Loaded now: ' + (set.key === 'drift' ? 'Drift' : 'Steady') + '.';
        Array.prototype.forEach.call(row.querySelectorAll('button'), function (b) { b.classList.toggle('primary', b.getAttribute('data-set') === set.key); });
      } }, set.label);
    }));
    box.append(row, msg);
    return box;
  }
  function updateDash() {                       // redraw only the cards that depend on the rules engine, so Viva's panel keeps its place
    if (D.getState().ui.screen !== 'dashboard') return;
    var dash = refs.main.querySelector('.dash'); if (!dash) return;
    var p = D.getActiveProfile(), map = { 'a-status': function () { return statusCard(p, D.statusCounts()); }, 'a-inds': function () { return indicatorsCard(p); }, 'a-alerts': function () { return Vivo.Followup.renderCard(); } };
    Object.keys(map).forEach(function (cls) {
      var old = dash.querySelector('.' + cls); if (!old) return;
      var open = Array.prototype.map.call(old.querySelectorAll('details[open]'), function (x) { return x.getAttribute('class') + '|' + (x.parentNode && x.parentNode.getAttribute('data-alert') || ''); });
      var nw = map[cls](); old.replaceWith(nw);
      Array.prototype.forEach.call(nw.querySelectorAll('details'), function (x) { if (open.indexOf(x.getAttribute('class') + '|' + (x.parentNode && x.parentNode.getAttribute('data-alert') || '')) >= 0) x.open = true; });
    });
  }
  function linkCard() {
    var m = D.getState().mission, box = h('section', { class: 'card', 'aria-label': 'Link status' }, h('h2', null, h('span', { html: icon('link') }), 'Link status (simulated)'),
      h('p', { class: 'muted' }, 'Choose how the link to Earth behaves. This is a simulation: nothing is ever sent. Alerts show the matching guidance (rule DST-1).'));
    var desc = { live: 'Live: contact is possible now.', delayed: 'Delayed: messages take up to about ' + C.LINK.delayed.minutes + ' minutes each way.', blackout: 'Blackout: no contact. Viva works in autonomy mode.' };
    var group = h('div', { class: 'seg linkseg', role: 'radiogroup', 'aria-label': 'Link status' });
    Object.keys(C.LINK).forEach(function (k) {
      group.append(h('button', { type: 'button', role: 'radio', 'aria-checked': m.link === k ? 'true' : 'false', 'data-link': k, 'aria-pressed': m.link === k ? 'true' : 'false', onclick: function () {
        D.setLink(k);
        Array.prototype.forEach.call(group.querySelectorAll('button'), function (b) { var on = b.getAttribute('data-link') === k; b.setAttribute('aria-checked', on ? 'true' : 'false'); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
        note.textContent = desc[k];
      } }, C.LINK[k].label));
    });
    var note = h('p', { class: 'note', role: 'status' }, desc[m.link]);
    box.append(group, note, h('p', { class: 'faint' }, V.line('WRN-26')), h('p', { class: 'faint' }, V.line('WRN-27', { minutes: C.LINK.delayed.minutes })), h('p', { class: 'faint' }, V.line('WRN-28')));
    return box;
  }
  function settings(main) {
    var voice = h('section', { class: 'card', 'aria-label': 'Voice settings' });
    V.renderVoiceSettings(voice);
    var remBox = h('section', { class: 'card', 'aria-label': 'Reminders and mission clock' });
    V.renderReminderSettings(remBox);
    var envBox = h('section', { class: 'card', 'aria-label': 'Mission environment', 'data-card': 'env' });
    Vivo.Env.render(envBox);
    main.append(h('div', { class: 'page' }, h('h1', null, 'Settings'), voice, remBox,
      demoCard(), linkCard(),
      h('section', { class: 'card' }, h('h2', null, h('span', { html: icon('sliders') }), 'Storage'),
        h('p', { class: 'muted' }, D.isStorageOk() ? 'Your settings and new profiles are saved on this device, in this browser only.' : V.line('SYS-15'))),
      envBox,
      h('p', { class: 'faint' }, 'Build ' + C.BUILD.version + ', Phase ' + C.BUILD.phase)));
  }

  /* ---- mount ---- */
  function mount(root) {
    D.load();
    buildShell(root);
    Vivo.bus.on('profile:switched', function () { updateProfileUi(); render(false); });
    Vivo.bus.on('assessment:updated', function () { updateDash(); });
    Vivo.bus.on('link:changed', function () { drawLinkPill(); });
    Vivo.bus.on('mission:changed', function () { var m = D.getState().mission; var el = refs.dayEl; if (el) el.textContent = String(m.day); });
    Vivo.bus.on('storage:failed', showStorageNotice);
    document.addEventListener('click', function (e) { if (menuOpen && !refs.menuWrap.contains(e.target)) closeMenu(); });
    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); route('dev'); return; }   // hidden developer panel
      if (e.key !== 'Escape') return;
      if (modalEls) closeModal(); else if (Vivo.Onboarding.isHelpOpen()) Vivo.Onboarding.closeHelp(); else if (menuOpen) { closeMenu(); refs.profileBtn.focus(); }
    });
    window.addEventListener('hashchange', function () { var id = routeFromHash(); if (id !== D.getState().ui.screen) route(id); });
    Vivo.Onboarding.greet();
    route(routeFromHash(), true);
    if (!D.isStorageOk()) showStorageNotice();
    var ticks = 0;
    clockTimer = setInterval(function () { tickClock(); Vivo.Vitals.onTick(); Vivo.Tasks.onTick(); Vivo.Briefing.onTick(); V.tick(); if (++ticks % 15 === 0) Vivo.Rules.tick(); }, 1000);   // the engine re-checks about every 15 seconds (stale readings, follow-up times)
  }

  function openEmergency(info) { Vivo.Emergency.open({ trigger: info }); }   // called by the rules engine for P0 symptoms and the two P1 values (EMG-1, VIT-3, VIT-5)
  function refresh() { render(false); }
  return { mount: mount, route: route, refresh: refresh, openEmergency: openEmergency, h: h, icon: icon, toast: toast, modal: modal, closeModal: closeModal };
})();

(function(){ function boot(){ Vivo.UI.mount(document.getElementById('app')); } if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();} })();
</script>
